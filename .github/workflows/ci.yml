name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # to draft the release for a tag

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test
      # The runner's own Chrome, driven by touch, mouse and keyboard.
      - name: End-to-end test in a real browser
        run: node tests/e2e.mjs
      # A tag vX.Y.Z drafts a release, to be read through and published by hand.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -q "\"huectl-$GITHUB_REF_NAME\"" sw.js || { echo "the tag does not match VERSION in sw.js"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --title "HueCtl ${GITHUB_REF_NAME#v}" --draft --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
