<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HueCtl · Screen softbox</title>
  <meta name="description" content="Turn any screen into a softbox, run from a control panel of knobs and keys: color temperature, tint, hue, saturation and a dimmer." />
  <meta name="theme-color" content="#ffede2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HueCtl" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="modulepreload" href="js/color.js" />
  <link rel="modulepreload" href="js/store.js" />
  <link rel="modulepreload" href="js/panel.js" />
  <script>
    // Paint the last light before any module loads, so there is no flash of the default color.
    try {
      var paint = JSON.parse(localStorage.getItem("huectl:v2")).paint;
      document.documentElement.style.setProperty("--light", paint.color);
      document.querySelector('meta[name="theme-color"]').content = paint.hex;
    } catch (error) {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="surface" class="surface" aria-hidden="true"></div>

  <!-- One control unit, docked at the bottom edge. Closed, only its display shows. -->
  <section id="panel" class="panel" aria-label="Light controls">
    <button
      id="toggle-panel"
      class="display"
      type="button"
      aria-expanded="false"
      aria-controls="controls"
      aria-label="Light controls"
      title="Controls (Space)"
    >
      <span class="glass">
        <span class="cells">
          <span class="cell" data-for="kelvin"><small>CCT</small><span><b id="kelvin-value">5600</b><i>K</i></span></span>
          <span class="cell" data-for="brightness"><small>INT</small><span><b id="brightness-value">100</b><i>%</i></span></span>
          <span class="cell" data-for="tint"><small>TINT</small><span><b id="tint-value">0</b></span></span>
          <span class="cell" data-for="hue"><small>HUE</small><span><b id="hue-value">0</b><i>°</i></span></span>
          <span class="cell" data-for="saturation"><small>SAT</small><span><b id="saturation-value">0</b><i>%</i></span></span>
        </span>
        <span class="flags">
          <span id="light-name" class="name">Daylight</span>
          <span id="flag-effect" class="flag">FX</span>
          <span id="flag-awake" class="flag">AWAKE</span>
          <span id="flag-lock" class="flag alert">LOCK</span>
          <span id="flag-standby" class="flag alert">STBY</span>
          <span id="timecode" class="timecode">--:--:--</span>
        </span>
      </span>
      <span class="chin"><b>HUECTL</b><span>SB-1</span></span>
    </button>

    <div id="controls" class="faceplate" inert>
      <div class="faceplate-inner">
        <div class="knobs">
          <label class="knob">
            <input id="kelvin" type="range" min="1500" max="9000" step="50" value="5600" aria-label="Color temperature" />
            <span class="knob-cap" aria-hidden="true"></span>
            <span class="legend" aria-hidden="true">CCT</span>
          </label>
          <label class="knob">
            <input id="brightness" type="range" min="5" max="100" step="1" value="100" aria-label="Brightness" />
            <span class="knob-cap" aria-hidden="true"></span>
            <span class="legend" aria-hidden="true">INT</span>
          </label>
          <label class="knob">
            <input id="tint" type="range" min="-100" max="100" step="1" value="0" aria-label="Tint, green to magenta" data-catch />
            <span class="knob-cap" aria-hidden="true"></span>
            <span class="legend" aria-hidden="true">TINT</span>
          </label>
          <label class="knob">
            <input id="hue" type="range" min="0" max="359" step="1" value="0" aria-label="Hue" />
            <span class="knob-cap" aria-hidden="true"></span>
            <span class="legend" aria-hidden="true">HUE</span>
          </label>
          <label class="knob">
            <input id="saturation" type="range" min="0" max="100" step="1" value="0" aria-label="Saturation" />
            <span class="knob-cap" aria-hidden="true"></span>
            <span class="legend" aria-hidden="true">SAT</span>
          </label>
        </div>

        <div id="presets" class="presets" role="group" aria-label="Presets"></div>

        <div class="keys" role="group" aria-label="Functions">
          <button id="effect" class="key" type="button" aria-pressed="false" title="Effect (E)">FX</button>
          <button id="timer" class="key" type="button" aria-pressed="false" title="Sunset timer">TIMER</button>
          <button id="awake" class="key" type="button" aria-pressed="true" aria-label="Keep awake" title="Keep the screen on">AWAKE</button>
          <button id="fullscreen" class="key" type="button" aria-pressed="false" aria-label="Fullscreen" title="Fullscreen (F or double-tap)">FULL</button>
          <button id="lock" class="key key-lock" type="button" aria-pressed="false" aria-label="Lock the light" title="Lock the light (L)">LOCK</button>
          <button id="power" class="key key-power" type="button" aria-pressed="true" aria-label="Light" title="Light on or off (P)">PWR</button>
        </div>

        <footer class="legends">
          <button id="help" class="link" type="button">How it works</button>
          <button id="install" class="link" type="button" hidden>Install app</button>
          <span class="shortcuts">← → CCT · ↑ ↓ INT · 1–7 · E FX · L LOCK · P PWR</span>
        </footer>
      </div>
    </div>
  </section>

  <div id="hint" class="hint" hidden>
    <p class="hint-title">Your screen is a softbox now.</p>
    <ul class="hint-list">
      <li><span class="hint-key" aria-hidden="true">↔</span>Swipe sideways for warmth</li>
      <li><span class="hint-key" aria-hidden="true">↕</span>Swipe up or down for brightness</li>
      <li><span class="hint-key" aria-hidden="true">▴</span>Tap the display for knobs and keys</li>
      <li><span class="hint-key" aria-hidden="true">◉</span>Slide up or down on a knob to turn it</li>
    </ul>
    <p class="hint-tip">Turn your device brightness all the way up for the most light.</p>
  </div>

  <p id="hud" class="hud" role="status" aria-live="polite"></p>
</body>
</html>
